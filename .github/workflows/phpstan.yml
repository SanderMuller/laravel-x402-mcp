name: phpstan

permissions:
  contents: read

on:
  push:
    paths:
      - '**.php'
      - 'phpstan.neon.dist'
      - 'phpstan-baseline.neon'
      - '.github/workflows/phpstan.yml'
      # A dependency-only change can break the analysis (a PHPStan extension
      # conflicting with another package registers the same services twice),
      # so composer metadata belongs in this filter too.
      - 'composer.json'
      - 'composer.lock'
      - 'testbench.yaml'
  pull_request:
    paths:
      - '**.php'
      - 'phpstan.neon.dist'
      - 'phpstan-baseline.neon'
      - '.github/workflows/phpstan.yml'
      # A dependency-only change can break the analysis (a PHPStan extension
      # conflicting with another package registers the same services twice),
      # so composer metadata belongs in this filter too.
      - 'composer.json'
      - 'composer.lock'
      - 'testbench.yaml'

concurrency:
  group: phpstan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gmp
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Cache PHPStan results
        uses: actions/cache@v5
        with:
          path: .cache/phpstan/
          key: phpstan-result-cache-${{ hashFiles('composer.lock', 'phpstan.neon.dist') }}
          restore-keys: phpstan-result-cache-

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github --no-interaction --memory-limit=2G
