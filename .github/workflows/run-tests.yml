name: run-tests

permissions:
  contents: read

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml'
      - 'composer.json'
      - 'composer.lock'
      - 'testbench.yaml'
      - 'workbench/**'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml'
      - 'composer.json'
      - 'composer.lock'
      - 'testbench.yaml'
      - 'workbench/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # PHP 8.3 dropped: composer.json requires php ^8.4, inherited from
        # sandermuller/laravel-x402 0.8.
        # L11 dropped: laravel-x402 0.8 requires illuminate ^12|^13.
        # L12 has no cell: Pest 5 needs symfony/process ^8.1 and testbench 10
        # pins ^7.2, so the pair cannot install. Laravel 12 stays in `require`
        # and breakage there is still a bug — it just isn't matrix-covered.
        php: ['8.4']
        laravel: ['13.*']
        stability: [prefer-lowest, prefer-stable]
        # Newest supported laravel/mcp on the full PHP x stability grid; the
        # older supported minors get one cell each below (see `include`).
        mcp: ['^1.0']
        include:
          - laravel: '13.*'
            testbench: '11.*'
          # One cell per older supported laravel/mcp minor. 0.7.1 is the
          # floor: 0.7.0 still had the pre-relocation
          # `Laravel\Mcp\Server\Transport\*` namespace.
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
            stability: prefer-stable
            mcp: '^0.7.1'
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
            stability: prefer-stable
            mcp: '^0.8'
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
            stability: prefer-stable
            mcp: '^0.9'

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - MCP ${{ matrix.mcp }} - ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, gmp
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "laravel/mcp:${{ matrix.mcp }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List installed dependencies
        run: composer show -D

      - name: Cache PHPUnit results
        uses: actions/cache@v6
        with:
          path: .phpunit.cache/
          key: phpunit-cache-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.mcp }}-${{ matrix.stability }}-${{ hashFiles('tests/**') }}
          restore-keys: phpunit-cache-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.mcp }}-${{ matrix.stability }}-

      - name: Execute tests
        run: vendor/bin/pest --ci
